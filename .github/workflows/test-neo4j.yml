on:
  push:
    branches:
      - master
      - main
    paths:
      - 'neo4j/**'
  pull_request:
    paths:
      - 'neo4j/**'
  workflow_dispatch:
name: "Tests Neo4j"

permissions:
  contents: read

jobs:
  Tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - 1.25.x
          - 1.26.x
    steps:
      - name: Fetch Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '${{ matrix.go-version }}'
      - name: Run Test
        run: cd ./neo4j && go test ./... -v -race
